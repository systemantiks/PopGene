[workspace]
members = ["crates/popgene-core", "crates/popgene-formats", "crates/popgene-desktop"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true


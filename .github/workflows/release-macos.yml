name: Draft macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Validate
        run: |
          cargo +1.99.1 fmt --all --check
          cargo +1.99.1 test --locked --workspace
          cargo +1.99.1 clippy --locked --workspace --all-targets -- -D warnings
          python3 scripts/test-release.py
          python3 scripts/collect-notices.py --strict
      - name: Configure temporary signing keychain
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/popgene-release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          export CERTIFICATE_PATH="$RUNNER_TEMP/popgene-signing.p12"
          python3 -c 'import os,base64; open(os.environ["CERTIFICATE_PATH"],"wb").write(base64.b64decode(os.environ["CERTIFICATE"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          xcrun notarytool store-credentials popgene-release --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
          rm "$CERTIFICATE_PATH"
      - name: Package and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_PROFILE: popgene-release
          APPLE_NOTARY_KEYCHAIN: ${{ runner.temp }}/popgene-release.keychain-db
        run: scripts/package-macos.sh --release
      - name: Download previous stable feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Use the same "latest" endpoint as the installed app. Only an explicit
          # 404 permits a first release; network/auth/API failures must stop.
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > dist/previous-release.json; then
            PREVIOUS=$(jq -r '.tag_name' dist/previous-release.json)
            gh release download "$PREVIOUS" --pattern appcast.xml --dir dist/previous
          elif [ "$(jq -r '.status' dist/previous-release.json)" != '404' ]; then
            exit 1
          fi
      - name: Sign archive and update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY"
          ARGS=()
          if [ -f dist/previous/appcast.xml ]; then
            ARGS+=(--previous-appcast dist/previous/appcast.xml)
          fi
          python3 scripts/prepare-release.py --archive "dist/PopGene-${RELEASE_TAG#v}-macos-arm64.zip" --notes "release/notes/${RELEASE_TAG#v}.md" "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: dist/release/
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "PopGene ${RELEASE_TAG#v}" --notes-file dist/release/release-notes.md dist/release/*.zip dist/release/appcast.xml
      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/popgene-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/popgene-signing.p12"
